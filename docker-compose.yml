services:
  app:
    build: .
    container_name: numori-notes-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # Public WebSocket URL the browser uses to reach the CRDT sync service.
      # Real-time collaboration is served by numori-crdt, which is deployed
      # separately so the realtime workload scales on its own and can be shared
      # with other apps. Point this at that deployment, e.g.
      # wss://crdt.example.com/notes, and configure the "notes" app there with
      # the same JWT_SECRET so it can verify the tokens this API mints.
      NUXT_PUBLIC_COLLAB_WS_URL: ${NUXT_PUBLIC_COLLAB_WS_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-db}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
